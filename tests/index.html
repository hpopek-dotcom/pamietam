<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Testy — Pamiętam</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; }
    .ok { color: #1b7f3b; } .fail { color: #b3261e; }
    pre { white-space: pre-wrap; background: #f3f3f3; padding: 8px; }
  </style>
</head>
<body>
  <h1 id="summary">Uruchamiam testy…</h1>
  <ul id="list"></ul>
  <script type="module">
    import { run } from './harness.js';
    import './entries.test.js';
    import './search.test.js';
    import './transcription.test.js';

    const { passed, failed, results } = await run();
    const summary = document.getElementById('summary');
    summary.textContent = `${failed ? 'FAIL' : 'PASS'} ${passed}/${passed + failed}`;
    summary.className = failed ? 'fail' : 'ok';
    document.title = summary.textContent;
    const list = document.getElementById('list');
    for (const r of results) {
      const li = document.createElement('li');
      li.className = r.ok ? 'ok' : 'fail';
      li.textContent = `${r.ok ? '✓' : '✗'} ${r.name}`;
      if (!r.ok) { const pre = document.createElement('pre'); pre.textContent = r.error; li.append(pre); }
      list.append(li);
    }
    document.body.dataset.done = 'true';
  </script>
</body>
</html>
